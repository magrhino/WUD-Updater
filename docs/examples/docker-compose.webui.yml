####### IMPORTANT NOTE #######
# Unless you have a specific reason to use the less secure raw Docker socket,
# you should use the hardened socket-proxy example instead of this one. The
# socket-proxy example gives the WUD-Updater container access to a minimized
# subset of the Docker API that is sufficient for managing WUD helper
# containers, but does not give it full control over the host Docker daemon.
services:
  wud:
    image: getwud/wud:latest
    networks:
      - wud-updater-app
      - wud-updater-egress
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - wud-scripts:/wud:ro
      - wud-out:/out
    # Configure your WUD trigger to call:
    #   /wud/on-update.sh

  wud-updater:
    image: ghcr.io/magrhino/wud-updater:latest
    environment:
      DOCKER_BASE: ${HOST_DOCKER_BASE:-/srv/docker}
      WUD_OUT_FILE: /out/images.todo
      WUD_LOG_DIR: /logs
      WUD_DB_PATH: /logs/wud-updater.sqlite
      WUD_TIMEZONE: "${WUD_TIMEZONE:-UTC}"
      WUD_WEB_HOST: 0.0.0.0
      WUD_WEB_PORT: "${WUD_WEB_PORT:-7417}"
      WUD_WEB_MUTATIONS_ENABLED: "${WUD_WEB_MUTATIONS_ENABLED:-false}"
      WUD_WEB_PUBLIC_ORIGIN: "${WUD_WEB_PUBLIC_ORIGIN:-}"
      WUD_WEB_ALLOWED_HOSTS: "${WUD_WEB_ALLOWED_HOSTS:-}"
      WUD_WEB_TRUSTED_PROXIES: "${WUD_WEB_TRUSTED_PROXIES:-}"
      WUD_WEB_SECURE_COOKIES: "${WUD_WEB_SECURE_COOKIES:-auto}"
      WUD_API_BASE_URL: "${WUD_API_BASE_URL:-http://wud:3000}"
      OUT_UID: "${OUT_UID:-1000}"
      OUT_GID: "${OUT_GID:-1000}"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
    networks:
      - wud-updater-app
      - wud-updater-egress
    ports:
      - "${WEBUI_HTTP_BIND:-127.0.0.1}:${WUD_WEB_PORT:-7417}:${WUD_WEB_PORT:-7417}"
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://127.0.0.1:${WUD_WEB_PORT:-7417}/readyz" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOST_DOCKER_BASE:-/srv/docker}:${HOST_DOCKER_BASE:-/srv/docker}
      - ${WEBUI_LOG_DIR:-./logs}:/logs
      - wud-scripts:/managed-wud
      - wud-out:/out
    command: [ "web" ]

networks:
  wud-updater-app:
    internal: true
  wud-updater-egress:

volumes:
  wud-scripts:
  wud-out:
