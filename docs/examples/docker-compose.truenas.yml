services:
  wud:
    image: getwud/wud:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - wud-scripts:/wud:ro
      - wud-out:/out
    # Configure your WUD trigger to call:
    #   /wud/on-update.sh

  wud-updater:
    build:
      context: ../..
      args:
        # Pick a client tag compatible with your TrueNAS release. See:
        #   https://github.com/truenas/api_client#version-compatibility--features
        TRUENAS_API_CLIENT_REF: ${TRUENAS_API_CLIENT_REF:-TS-26.0.0-BETA.1}
    image: magrhino/wud-updater:truenas-status
    environment:
      DOCKER_BASE: /host/docker
      WUD_OUT_FILE: /out/images.todo
      WUD_LOG_DIR: /logs
      WUD_SYNC_SCRIPTS: "1"
      WUD_SCRIPTS_DIR: /managed-wud
      WUD_UPDATER_PYTHON: "1"
      WUD_UPDATER_USE_SUDO: "0"
      OUT_UID: "1000"
      OUT_GID: "1000"
      # Uses Docker to start a short-lived helper container that mounts the
      # local TrueNAS middleware socket and writes sanitized status JSON to /out.
      TRUENAS_STATUS_CHECK: "1"
      TRUENAS_STATUS_TIMEOUT: "5"
    volumes:
      # WARNING: the Docker socket gives root-equivalent control over the host.
      # Prefer the hardened socket-proxy example when you do not need this raw
      # socket in the helper container.
      - /var/run/docker.sock:/var/run/docker.sock
      - /srv/docker:/host/docker
      - ./logs:/logs
      - wud-scripts:/managed-wud
      - wud-out:/out
    command: ["updates", "--dry-run"]

volumes:
  wud-scripts:
  wud-out:
