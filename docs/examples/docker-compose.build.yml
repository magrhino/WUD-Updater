# This is only if you want to build the WUD-Updater image yourself. You can also just use the pre-built image from GHCR, which is what the docker-compose.hardened.yml example does.
services:
  wud:
    image: getwud/wud:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - wud-scripts:/wud:ro
      - wud-out:/out
    # Configure your WUD trigger to call:
    #   /wud/on-update.sh

  wud-updater:
    build: ../..
    image: magrhino/wud-updater:local
    environment:
      DOCKER_BASE: ${HOST_DOCKER_BASE:-/srv/docker}
      WUD_OUT_FILE: /out/images.todo
      WUD_LOG_DIR: /logs
      WUD_SYNC_SCRIPTS: "true"
      WUD_SCRIPTS_DIR: /managed-wud
      OUT_UID: "1000"
      OUT_GID: "1000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOST_DOCKER_BASE:-/srv/docker}:${HOST_DOCKER_BASE:-/srv/docker}
      - ./logs:/logs
      - wud-scripts:/managed-wud
      - wud-out:/out
    command: [ "updates", "--dry-run" ]

volumes:
  wud-scripts:
  wud-out:
