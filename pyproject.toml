[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wud-updater"
version = "0.0.0"
description = "Python package skeleton for the future WUD updater refactor."
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
wud-updater = "wud_updater.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
