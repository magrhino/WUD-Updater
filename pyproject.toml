[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wud-updater"
version = "0.42.1"
description = "Python package for WUD updater commands."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "argon2-cffi>=23.1,<26",
    "fastapi>=0.115,<1",
    "pydantic==2.13.4",
    "pydantic-core==2.46.4",
    "rich>=13.7,<16",
    "ruamel.yaml>=0.18.13,<0.20",
    "tzdata>=2024.1",
    "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.0,<10",
    "pytest-cov>=4.0,<8",
    "pytest-xdist>=3.5,<4",
    "ruff==0.15.15",
    "pip-tools>=7.4,<8",
]

[project.scripts]
wud-updater = "wud_updater.cli:main"

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_python_*.py"]
pythonpath = ["src"]
addopts = "-n auto"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wud_updater = ["ascii-text-art.txt", "web_static/index.html", "web_static/assets/*"]
