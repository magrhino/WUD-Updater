[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wud-updater"
version = "0.4.1"
description = "Python package for WUD updater commands."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff==0.15.13",
]

[project.scripts]
wud-updater = "wud_updater.cli:main"

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py310"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
