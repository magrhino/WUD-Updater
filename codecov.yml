coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        target: auto
        informational: true
      webui-contract:
        target: 70%
        threshold: 30%
        informational: true
        only_pulls: true
        flags:
          - webui
        paths:
          - webui/src/api/
          - webui/src/stores/
          - webui/src/composables/
        flag_coverage_not_uploaded_behavior: exclude

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: true
