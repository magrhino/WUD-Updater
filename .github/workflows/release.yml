name: release

on:
  push:
    tags:
      - "v*.*.*"
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: magrhino/wud-updater

jobs:
  validate-tag:
    name: validate tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      minor: ${{ steps.tag.outputs.minor }}

    steps:
      - name: Validate release tag
        id: tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          set -euo pipefail

          tag="$RELEASE_TAG"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Release tags must match vX.Y.Z, got: %s\n' "$tag" >&2
            exit 1
          fi

          version="${tag#v}"
          minor="${version%.*}"
          {
            printf 'tag=%s\n' "$tag"
            printf 'version=%s\n' "$version"
            printf 'minor=%s\n' "$minor"
          } >> "$GITHUB_OUTPUT"

  test:
    name: linux tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - validate-tag
    if: ${{ github.event_name != 'release' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-tag.outputs.tag }}
          persist-credentials: false

      - name: Install ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi

      - name: Install Python dev dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install -e '.[dev]'
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run tests
        run: tests/run-all.sh

  publish-image:
    name: publish image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    needs:
      - validate-tag
      - test
    if: >-
      ${{
        always() &&
        needs.validate-tag.result == 'success' &&
        (needs.test.result == 'success' || needs.test.result == 'skipped')
      }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-tag.outputs.tag }}
          persist-credentials: false

      - name: Log in to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s\n' "$GHCR_TOKEN" | docker login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin

      - name: Build image
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
          VERSION: ${{ needs.validate-tag.outputs.version }}
          MINOR_VERSION: ${{ needs.validate-tag.outputs.minor }}
        run: |
          set -euo pipefail

          image="$REGISTRY/$IMAGE_NAME"
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$RELEASE_TAG" \
            -t "$image:$RELEASE_TAG" \
            -t "$image:$VERSION" \
            -t "$image:$MINOR_VERSION" \
            -t "$image:latest" \
            .

      - name: Validate image
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
        run: |
          set -euo pipefail

          image="$REGISTRY/$IMAGE_NAME"
          sync_tmp="$(mktemp -d)"
          cleanup(){
            rm -rf "$sync_tmp"
          }
          trap cleanup EXIT

          docker run --rm "$image:$RELEASE_TAG"
          docker run --rm -e WUD_UPDATER_PYTHON=1 "$image:$RELEASE_TAG"
          docker run --rm -v "$sync_tmp:/managed-wud" "$image:$RELEASE_TAG" sync-wud-scripts
          [[ -x "$sync_tmp/on-update.sh" ]]
          [[ -x "$sync_tmp/append-updates.sh" ]]
          [[ -x "$sync_tmp/github-release-embed.sh" ]]
          [[ -f "$sync_tmp/upstreams.txt" ]]
          docker run --rm "$image:$RELEASE_TAG" docker-update-from-wud --help

      - name: Push image
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
          VERSION: ${{ needs.validate-tag.outputs.version }}
          MINOR_VERSION: ${{ needs.validate-tag.outputs.minor }}
        run: |
          set -euo pipefail

          image="$REGISTRY/$IMAGE_NAME"
          docker push "$image:$RELEASE_TAG"
          docker push "$image:$VERSION"
          docker push "$image:$MINOR_VERSION"
          docker push "$image:latest"

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            printf 'Release already exists for %s\n' "$RELEASE_TAG"
            exit 0
          fi

          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --generate-notes \
            --title "$RELEASE_TAG"
