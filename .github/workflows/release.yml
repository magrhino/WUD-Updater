name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable release tag to publish, formatted as vX.Y.Z.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: magrhino/wud-updater

jobs:
  validate-tag:
    name: validate tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      minor: ${{ steps.tag.outputs.minor }}

    steps:
      - name: Validate release tag
        id: tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail

          tag="$RELEASE_TAG"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Release tags must match vX.Y.Z, got: %s\n' "$tag" >&2
            exit 1
          fi

          version="${tag#v}"
          minor="${version%.*}"
          {
            printf 'tag=%s\n' "$tag"
            printf 'version=%s\n' "$version"
            printf 'minor=%s\n' "$minor"
          } >> "$GITHUB_OUTPUT"

  release-gate:
    name: release gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs:
      - validate-tag

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-tag.outputs.tag }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi

      - name: Install Python dev dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install -e '.[dev]'
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run tests
        run: tests/run-all.sh

      - name: Show Docker versions
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker compose version

      - name: Run container build test
        run: tests/container-build.sh

      - name: Run Docker end-to-end test
        run: tests/e2e-docker-compose.sh

      - name: Install frontend dependencies
        run: npm --prefix webui ci

      - name: Install Chromium
        run: npm --prefix webui exec playwright install chromium

      - name: Run WebUI smoke tests
        run: npm --prefix webui run test:smoke

  publish-image:
    name: publish image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    needs:
      - validate-tag
      - release-gate
    if: >-
      ${{
        always() &&
        needs.validate-tag.result == 'success' &&
        needs.release-gate.result == 'success'
      }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-tag.outputs.tag }}
          persist-credentials: false

      - name: Resolve release commit
        id: release-commit
        shell: bash
        run: |
          set -euo pipefail
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s\n' "$GHCR_TOKEN" | docker login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin

      - name: Build amd64 smoke image
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
          VERSION: ${{ needs.validate-tag.outputs.version }}
          MINOR_VERSION: ${{ needs.validate-tag.outputs.minor }}
          RELEASE_SHA: ${{ steps.release-commit.outputs.sha }}
        run: |
          set -euo pipefail

          image="$REGISTRY/$IMAGE_NAME"
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$RELEASE_SHA" \
            --label "org.opencontainers.image.version=$RELEASE_TAG" \
            -t "$image:$RELEASE_TAG" \
            -t "$image:$VERSION" \
            -t "$image:$MINOR_VERSION" \
            -t "$image:latest" \
            .

      - name: Validate amd64 smoke image
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
        run: |
          set -euo pipefail

          image="$REGISTRY/$IMAGE_NAME"
          sync_tmp="$(mktemp -d)"
          cleanup(){
            rm -rf "$sync_tmp"
          }
          trap cleanup EXIT

          docker run --rm "$image:$RELEASE_TAG"
          docker run --rm -e WUD_UPDATER_PYTHON=true "$image:$RELEASE_TAG"
          docker run --rm -v "$sync_tmp:/managed-wud" "$image:$RELEASE_TAG" sync-wud-scripts
          [[ -x "$sync_tmp/on-update.sh" ]]
          [[ -x "$sync_tmp/append-updates.sh" ]]
          [[ -x "$sync_tmp/github-release-embed.sh" ]]
          [[ -f "$sync_tmp/upstreams.txt" ]]
          docker run --rm "$image:$RELEASE_TAG" docker-update-from-wud --help

      - name: Publish multi-arch image
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
          VERSION: ${{ needs.validate-tag.outputs.version }}
          MINOR_VERSION: ${{ needs.validate-tag.outputs.minor }}
          RELEASE_SHA: ${{ steps.release-commit.outputs.sha }}
        run: |
          set -euo pipefail

          image="$REGISTRY/$IMAGE_NAME"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --provenance=false \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$RELEASE_SHA" \
            --label "org.opencontainers.image.version=$RELEASE_TAG" \
            -t "$image:$RELEASE_TAG" \
            -t "$image:$VERSION" \
            -t "$image:$MINOR_VERSION" \
            -t "$image:latest" \
            --push \
            .

      - name: Validate multi-arch image manifests
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
          VERSION: ${{ needs.validate-tag.outputs.version }}
          MINOR_VERSION: ${{ needs.validate-tag.outputs.minor }}
        run: |
          set -euo pipefail

          image="$REGISTRY/$IMAGE_NAME"
          expected_platforms="linux/amd64 linux/arm64"

          for tag in "$RELEASE_TAG" "$VERSION" "$MINOR_VERSION" latest; do
            ref="$image:$tag"
            platforms="$(
              docker buildx imagetools inspect --raw "$ref" |
                jq -r '[.manifests[].platform | "\(.os)/\(.architecture)"] | sort | unique | join(" ")'
            )"

            if [[ "$platforms" != "$expected_platforms" ]]; then
              printf 'Expected %s to publish platforms "%s", got "%s"\n' "$ref" "$expected_platforms" "$platforms" >&2
              exit 1
            fi
          done

      - name: Create or publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
        run: |
          set -euo pipefail

          if release_is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [[ "$release_is_draft" == "true" ]]; then
              gh release edit "$RELEASE_TAG" --draft=false --verify-tag
              printf 'Published draft release for %s\n' "$RELEASE_TAG"
            else
              printf 'Release already exists for %s\n' "$RELEASE_TAG"
            fi
            exit 0
          fi

          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --generate-notes \
            --title "$RELEASE_TAG"
