name: webui demo pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/actions/setup-node-env/**"
      - ".github/workflows/webui-demo-pages.yml"
      - "webui/**"
      - "README.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: webui-demo-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-node-env

      - name: Install Chromium
        run: npm --prefix webui exec playwright install chromium

      - name: Build, validate, and smoke-test static demo
        run: npm --prefix webui run test:smoke:demo

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: webui/dist

  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
