name: ci

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_macos:
        description: Run the optional macOS validation job.
        required: false
        default: false
        type: boolean
      run_docker:
        description: Run the optional Docker image build job.
        required: false
        default: false
        type: boolean
      run_e2e:
        description: Run the optional Docker end-to-end job.
        required: false
        default: false
        type: boolean
      run_webui_smoke:
        description: Run the optional WebUI browser smoke tests.
        required: false
        default: false
        type: boolean
      run_webui_demo:
        description: Run the optional static WebUI demo checks.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        !(
          (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[skip ci]')) ||
          (github.event_name == 'push' && (
            startsWith(github.event.head_commit.message, 'docs:') ||
            startsWith(github.event.head_commit.message, 'docs(') ||
            startsWith(github.event.head_commit.message, 'docs!:') ||
            startsWith(github.event.head_commit.message, 'chore:') ||
            startsWith(github.event.head_commit.message, 'chore(') ||
            startsWith(github.event.head_commit.message, 'chore!:')
          ))
        )
      }}
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
      docker_e2e: ${{ steps.filter.outputs.docker_e2e }}
      webui_smoke: ${{ steps.filter.outputs.webui_smoke }}
      webui_demo: ${{ steps.filter.outputs.webui_demo }}
      workflows: ${{ steps.filter.outputs.workflows }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect relevant path changes
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          files=()
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            mapfile -t files < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          elif [[ "$EVENT_NAME" == "push" ]]; then
            if [[ -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
              mapfile -t files < <(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA")
            else
              mapfile -t files < <(git diff-tree --no-commit-id --name-only -r "$HEAD_SHA")
            fi
          fi

          docker=false
          docker_e2e=false
          webui_smoke=false
          webui_demo=false
          workflows=false
          for file in "${files[@]}"; do
            case "$file" in
              Dockerfile|.dockerignore|entrypoint.sh|docs/examples/docker-compose*.yml|bin/*|wud/*|webui/**|tests/container-build.sh|tests/e2e-docker-compose.sh|tests/test-entrypoint.sh)
                docker=true
                ;;
            esac
            case "$file" in
              Dockerfile|.dockerignore|entrypoint.sh|pyproject.toml|bin/*|wud/*|src/wud_updater/*|tests/e2e-docker-compose.sh)
                docker_e2e=true
                ;;
            esac
            case "$file" in
              webui/**)
                webui_smoke=true
                ;;
            esac
            case "$file" in
              webui/**|.github/workflows/ci.yml|.github/workflows/webui-demo-pages.yml)
                webui_demo=true
                ;;
            esac
            case "$file" in
              .github/workflows/*)
                workflows=true
                ;;
            esac
          done

          {
            printf 'docker=%s\n' "$docker"
            printf 'docker_e2e=%s\n' "$docker_e2e"
            printf 'webui_smoke=%s\n' "$webui_smoke"
            printf 'webui_demo=%s\n' "$webui_demo"
            printf 'workflows=%s\n' "$workflows"
          } >> "$GITHUB_OUTPUT"

  python-tests:
    name: python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        !(
          (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[skip ci]')) ||
          (github.event_name == 'push' && (
            startsWith(github.event.head_commit.message, 'docs:') ||
            startsWith(github.event.head_commit.message, 'docs(') ||
            startsWith(github.event.head_commit.message, 'docs!:') ||
            startsWith(github.event.head_commit.message, 'chore:') ||
            startsWith(github.event.head_commit.message, 'chore(') ||
            startsWith(github.event.head_commit.message, 'chore!:')
          ))
        )
      }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Python dev dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install -e '.[dev]'
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run tests
        run: tests/run-all.sh --python

      - name: Upload results to Codecov
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  shell-tests:
    name: shell tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        !(
          (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[skip ci]')) ||
          (github.event_name == 'push' && (
            startsWith(github.event.head_commit.message, 'docs:') ||
            startsWith(github.event.head_commit.message, 'docs(') ||
            startsWith(github.event.head_commit.message, 'docs!:') ||
            startsWith(github.event.head_commit.message, 'chore:') ||
            startsWith(github.event.head_commit.message, 'chore(') ||
            startsWith(github.event.head_commit.message, 'chore!:')
          ))
        )
      }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Python dev dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install -e '.[dev]'
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi

      - name: Run tests
        run: tests/run-all.sh --shell

  webui-checks:
    name: webui checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        !(
          (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[skip ci]')) ||
          (github.event_name == 'push' && (
            startsWith(github.event.head_commit.message, 'docs:') ||
            startsWith(github.event.head_commit.message, 'docs(') ||
            startsWith(github.event.head_commit.message, 'docs!:') ||
            startsWith(github.event.head_commit.message, 'chore:') ||
            startsWith(github.event.head_commit.message, 'chore(') ||
            startsWith(github.event.head_commit.message, 'chore!:')
          ))
        )
      }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Run tests
        run: tests/run-all.sh --webui

  webui-smoke:
    name: webui smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - changes
    if: >-
      ${{
        !(
          (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[skip ci]')) ||
          (github.event_name == 'push' && (
            startsWith(github.event.head_commit.message, 'docs:') ||
            startsWith(github.event.head_commit.message, 'docs(') ||
            startsWith(github.event.head_commit.message, 'docs!:') ||
            startsWith(github.event.head_commit.message, 'chore:') ||
            startsWith(github.event.head_commit.message, 'chore(') ||
            startsWith(github.event.head_commit.message, 'chore!:')
          ))
        ) &&
        (
          (github.event_name == 'workflow_dispatch' && inputs.run_webui_smoke) ||
          needs.changes.outputs.webui_smoke == 'true'
        )
      }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix webui ci

      - name: Install Chromium
        run: npm --prefix webui exec playwright install chromium

      - name: Run WebUI smoke tests
        run: npm --prefix webui run test:smoke

  webui-demo:
    name: webui demo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - changes
    if: >-
      ${{
        !(
          (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[skip ci]')) ||
          (github.event_name == 'push' && (
            startsWith(github.event.head_commit.message, 'docs:') ||
            startsWith(github.event.head_commit.message, 'docs(') ||
            startsWith(github.event.head_commit.message, 'docs!:') ||
            startsWith(github.event.head_commit.message, 'chore:') ||
            startsWith(github.event.head_commit.message, 'chore(') ||
            startsWith(github.event.head_commit.message, 'chore!:')
          ))
        ) &&
        (
          (github.event_name == 'workflow_dispatch' && inputs.run_webui_demo) ||
          needs.changes.outputs.webui_demo == 'true'
        )
      }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix webui ci

      - name: Build static WebUI demo
        run: npm --prefix webui run build:demo

      - name: Install Chromium
        run: npm --prefix webui exec playwright install chromium

      - name: Run static WebUI demo smoke tests
        run: npm --prefix webui run test:smoke:demo

  macos-tests:
    name: macos tests
    runs-on: macos-latest
    timeout-minutes: 20
    if: >-
      ${{
        !(
          (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[skip ci]')) ||
          (github.event_name == 'push' && (
            startsWith(github.event.head_commit.message, 'docs:') ||
            startsWith(github.event.head_commit.message, 'docs(') ||
            startsWith(github.event.head_commit.message, 'docs!:') ||
            startsWith(github.event.head_commit.message, 'chore:') ||
            startsWith(github.event.head_commit.message, 'chore(') ||
            startsWith(github.event.head_commit.message, 'chore!:')
          ))
        ) &&
        (
          (github.event_name == 'workflow_dispatch' && inputs.run_macos) ||
          (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:macos'))
        )
      }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v shellcheck >/dev/null 2>&1; then
            brew install shellcheck
          fi

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Python dev dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install -e '.[dev]'
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run tests
        run: tests/run-all.sh

  docker-build:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - changes
    if: >-
      ${{
        !(
          (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[skip ci]')) ||
          (github.event_name == 'push' && (
            startsWith(github.event.head_commit.message, 'docs:') ||
            startsWith(github.event.head_commit.message, 'docs(') ||
            startsWith(github.event.head_commit.message, 'docs!:') ||
            startsWith(github.event.head_commit.message, 'chore:') ||
            startsWith(github.event.head_commit.message, 'chore(') ||
            startsWith(github.event.head_commit.message, 'chore!:')
          ))
        ) &&
        (
          (github.event_name == 'workflow_dispatch' && inputs.run_docker) ||
          (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:docker')) ||
          needs.changes.outputs.docker == 'true'
        )
      }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run container build test
        run: tests/container-build.sh

  docker-e2e:
    name: docker e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - changes
    if: >-
      ${{
        !(
          (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[skip ci]')) ||
          (github.event_name == 'push' && (
            startsWith(github.event.head_commit.message, 'docs:') ||
            startsWith(github.event.head_commit.message, 'docs(') ||
            startsWith(github.event.head_commit.message, 'docs!:') ||
            startsWith(github.event.head_commit.message, 'chore:') ||
            startsWith(github.event.head_commit.message, 'chore(') ||
            startsWith(github.event.head_commit.message, 'chore!:')
          ))
        ) &&
        (
          (github.event_name == 'workflow_dispatch' && inputs.run_e2e) ||
          (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:e2e')) ||
          needs.changes.outputs.docker_e2e == 'true'
        )
      }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run Docker end-to-end test
        run: tests/e2e-docker-compose.sh

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - changes
    if: >-
      ${{
        !(
          (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[skip ci]')) ||
          (github.event_name == 'push' && (
            startsWith(github.event.head_commit.message, 'docs:') ||
            startsWith(github.event.head_commit.message, 'docs(') ||
            startsWith(github.event.head_commit.message, 'docs!:') ||
            startsWith(github.event.head_commit.message, 'chore:') ||
            startsWith(github.event.head_commit.message, 'chore(') ||
            startsWith(github.event.head_commit.message, 'chore!:')
          ))
        ) &&
        (
          github.event_name == 'workflow_dispatch' ||
          needs.changes.outputs.workflows == 'true'
        )
      }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check workflow files
        uses: docker://rhysd/actionlint:1.7.12@sha256:9d36088643581e728c969f35141f88139fec77280b2be23c1f66f8e40e1025e7
        with:
          args: -color
