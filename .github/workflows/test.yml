name: test

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          if command -v shellcheck >/dev/null 2>&1; then
            exit 0
          fi
          case "$RUNNER_OS" in
            Linux)
              sudo apt-get update
              sudo apt-get install -y shellcheck
              ;;
            macOS)
              brew install shellcheck
              ;;
            *)
              echo "Unsupported runner OS: $RUNNER_OS" >&2
              exit 1
              ;;
          esac

      - name: Install Python dev dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install -e '.[dev]'
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run tests
        run: tests/run-all.sh

  image-build:
    name: image-build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t wud-updater:test .

      - name: Smoke test image commands
        run: |
          set -euo pipefail
          docker run --rm wud-updater:test updates --help
          docker run --rm wud-updater:test docker-update-from-wud --help
          docker run --rm wud-updater:test bash -n /app/bin/updates /app/bin/docker-update-from-wud
          docker run --rm wud-updater:test sh -n /app/wud/on-update.sh /app/wud/append-updates.sh
