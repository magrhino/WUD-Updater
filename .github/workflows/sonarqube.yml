name: sonarqube

on:
  workflow_run:
    workflows: ["ci"]
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  sonarqube:
    name: sonarqube
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.repository.private == false
      }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Check coverage artifacts
        id: coverage-artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          artifacts="$(gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}/artifacts" --jq '.artifacts[].name')"
          have_python=false
          have_webui=false

          while IFS= read -r artifact_name; do
            case "$artifact_name" in
              python-coverage)
                have_python=true
                ;;
              webui-coverage)
                have_webui=true
                ;;
            esac
          done <<< "$artifacts"

          if [[ "$have_python" == true && "$have_webui" == true ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping SonarQube scan because this CI run did not upload both coverage artifacts."
          fi

      - name: Download Python coverage
        if: ${{ steps.coverage-artifacts.outputs.present == 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-coverage
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download WebUI coverage
        if: ${{ steps.coverage-artifacts.outputs.present == 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: webui-coverage
          path: webui/coverage
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: SonarQube Scan
        if: ${{ steps.coverage-artifacts.outputs.present == 'true' }}
        uses: SonarSource/sonarqube-scan-action@689fb39b34b9aa95ebc5f8f119343ddd51542402 # v4.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=magrhino_WUD-Updater
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.javascript.lcov.reportPaths=webui/coverage/lcov.info
            -Dsonar.sources=src,webui/src,wud,bin
            -Dsonar.scm.revision=${{ github.event.workflow_run.head_sha }}
